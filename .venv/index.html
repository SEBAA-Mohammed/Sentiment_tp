<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentiment Classifier</title>
<style>
  body { font-family: system-ui, sans-serif; background:#f3f4f6; margin:0; padding:2rem 1rem; color:#111827; }
  .card { max-width:560px; margin:0 auto; background:#fff; padding:1.5rem; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { margin-top:0; font-size:1.4rem; }
  label { display:block; margin:1rem 0 .3rem; font-weight:600; }
  textarea, select { width:100%; padding:.6rem; font-size:1rem; border:1px solid #d1d5db; border-radius:8px; box-sizing:border-box; }
  textarea { min-height:120px; resize:vertical; }
  button { margin-top:1rem; width:100%; padding:.7rem; font-size:1rem; border:0; border-radius:8px; background:#4f46e5; color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #result { margin-top:1.2rem; padding:1rem; border-radius:8px; text-align:center; display:none; }
  #result .label { font-size:1.6rem; font-weight:700; }
  #result .meta { font-size:.9rem; margin-top:.3rem; opacity:.8; }
  .positive { background:#dcfce7; color:#166534; }
  .negative { background:#fee2e2; color:#991b1b; }
  .neutral  { background:#e5e7eb; color:#374151; }
  .error    { background:#fef3c7; color:#92400e; }
</style>
</head>
<body>
<div class="card">
  <h1>Text Sentiment Classifier</h1>

  <label for="text">Your text</label>
  <textarea id="text" placeholder="Type a chat message, comment or feedback..."></textarea>

  <label for="model">Algorithm</label>
  <select id="model">
    <option value="svm">Support Vector Machine (SVM)</option>
    <option value="naive_bayes">Naive Bayes</option>
    <option value="random_forest">Random Forest</option>
  </select>

  <button id="btn" onclick="predict()">Analyze sentiment</button>

  <div id="result"></div>
</div>

<script>
// After deploying on Render, paste your Render URL here (no trailing slash):
const RENDER_URL = "https://YOUR-APP-NAME.onrender.com";
// On GitHub Pages -> call the Render API. Locally / on Render -> same server ("").
const API_BASE = location.hostname.endsWith("github.io") ? RENDER_URL : "";

async function predict() {
  const btn = document.getElementById("btn");
  const box = document.getElementById("result");
  btn.disabled = true;
  box.style.display = "block";
  box.className = "neutral";
  box.textContent = "Analyzing... (the free server can take up to a minute to wake up)";
  try {
    const res = await fetch(API_BASE + "/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text: document.getElementById("text").value,
        model: document.getElementById("model").value
      })
    });
    const data = await res.json();
    box.style.display = "block";
    box.textContent = "";
    if (!res.ok) {
      box.className = "error";
      box.textContent = data.error || "Something went wrong.";
      return;
    }
    const emoji = { positive: "😊", negative: "😠", neutral: "😐" }[data.sentiment] || "";
    box.className = data.sentiment;
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = emoji + " " + data.sentiment.toUpperCase();
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = "Confidence: " + (data.confidence * 100).toFixed(1) + "%  |  Model: " + data.model;
    box.append(label, meta);
  } catch (e) {
    box.style.display = "block";
    box.className = "error";
    box.textContent = "Cannot reach the server.";
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
